<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 130" width="240" height="130">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect width="240" height="130" fill="#ffffff"/>

  <!-- header -->
  <rect x="0" y="0" width="240" height="18" fill="#7c3aed"/>
  <rect x="8" y="6" width="20" height="7" rx="2" fill="#ffffff" opacity="0.7"/>
  <rect x="150" y="7" width="14" height="2.4" rx="1" fill="#ffffff" opacity="0.55"/>
  <rect x="168" y="7" width="14" height="2.4" rx="1" fill="#ffffff" opacity="0.55"/>
  <rect x="186" y="7" width="14" height="2.4" rx="1" fill="#ffffff" opacity="0.55"/>
  <rect x="206" y="7" width="14" height="2.4" rx="1" fill="#ffffff" opacity="0.55"/>
  <circle cx="228" cy="9" r="3.4" fill="#ffffff" opacity="0.5"/>

  <!-- hero -->
  <rect x="0" y="18" width="240" height="44" fill="url(#hero)"/>
  <rect x="70" y="31" width="100" height="5" rx="2.5" fill="#ffffff" opacity="0.92"/>
  <rect x="86" y="41" width="68" height="3.4" rx="1.7" fill="#ffffff" opacity="0.6"/>
  <rect x="100" y="50" width="40" height="6.5" rx="3.2" fill="#ffffff"/>

  <!-- drag handles hint -->
  <g fill="#7c3aed" opacity="0.35">
    <circle cx="20" cy="40" r="1.4"/><circle cx="20" cy="44" r="1.4"/>
    <circle cx="222" cy="40" r="1.4"/><circle cx="222" cy="44" r="1.4"/>
  </g>

  <!-- blocks row 1 -->
  <rect x="8" y="70" width="110" height="26" rx="4" fill="url(#card)" stroke="#ddd6fe"/>
  <rect x="14" y="76" width="40" height="3.4" rx="1.7" fill="#7c3aed" opacity="0.7"/>
  <rect x="14" y="83" width="86" height="2.6" rx="1.3" fill="#c4b5fd"/>
  <rect x="14" y="88" width="64" height="2.6" rx="1.3" fill="#c4b5fd"/>

  <rect x="122" y="70" width="110" height="26" rx="4" fill="url(#card)" stroke="#ddd6fe"/>
  <rect x="128" y="76" width="40" height="3.4" rx="1.7" fill="#7c3aed" opacity="0.7"/>
  <rect x="128" y="83" width="86" height="2.6" rx="1.3" fill="#c4b5fd"/>
  <rect x="128" y="88" width="64" height="2.6" rx="1.3" fill="#c4b5fd"/>

  <!-- blocks row 2 -->
  <rect x="8" y="100" width="156" height="10" rx="3" fill="#f5f3ff" stroke="#ede9fe"/>
  <rect x="170" y="100" width="62" height="10" rx="3" fill="#ddd6fe"/>

  <!-- footer -->
  <rect x="0" y="114" width="240" height="16" fill="#1f2937"/>
  <rect x="8" y="120" width="34" height="2.4" rx="1" fill="#ffffff" opacity="0.45"/>
  <rect x="190" y="120" width="42" height="2.4" rx="1" fill="#ffffff" opacity="0.3"/>
</svg>
